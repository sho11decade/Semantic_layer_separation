[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-layer-separation"
version = "0.1.0"
description = "MVP for semantic layer separation with Azure OpenAI, Grounding DINO, and SAM 2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "numpy>=1.26.0",
  "pillow>=10.4.0",
  "opencv-python-headless>=4.10.0.84",
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "transformers>=4.43.0",
]

[project.scripts]
sls = "semantic_layer_separation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]